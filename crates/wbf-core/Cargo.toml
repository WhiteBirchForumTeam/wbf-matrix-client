[package]
name = "wbf-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "常駐狀態：解鎖一次的 vault、資料目錄的佈局、多帳號。沒有 RPC、沒有命令列。介面見 /docs/design/overview/architecture-v2.md §6。"

[dependencies]
wbf-sdk = { path = "../wbf-sdk", features = ["matrix", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["sync", "io-util"] }
# 資料平面上傳邊收邊算整檔 SHA-256（attachment_ops.rs）；跟 wbf-sdk 同一份。
sha2 = "0.10"
hex = "0.4"
# 線的請求自己造 pack（link_requests.rs，/docs/design/daemon/link-requests.md §3）。本 repo 的 codec，不是上游依賴。
wbf-wire = { path = "../wbf-wire" }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
