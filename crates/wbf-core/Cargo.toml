[package]
name = "wbf-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "常駐狀態：解鎖一次的 vault、資料目錄的佈局、多帳號。沒有 RPC、沒有命令列。介面見 docs/design/architecture-v2.md §7。"

[dependencies]
wbf-sdk = { path = "../wbf-sdk", features = ["matrix", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
wbf-wire = { path = "../wbf-wire" }
