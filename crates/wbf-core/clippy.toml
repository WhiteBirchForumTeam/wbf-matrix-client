# 只管 wbf-core（clippy 從 crate 目錄往上找第一份 clippy.toml）。
# 維護者 2026-11-18：背景 task 一律從閘門起（`src/shutdown.rs` 的 `BackgroundGate::spawn`），關機開始之後不起任何新工作。
# 直接呼叫下面這些就是繞過閘門；crate 根的 `deny(clippy::disallowed_methods)` 讓它編譯不過（測試建置放行）。
# 真的要用的地方（子 task、當場 await 的阻塞工作、cache.db 的寫入執行緒）就地 `#[allow(clippy::disallowed_methods)]` 並寫明理由。
# PR #88 審查 oliver 🟡：第一版只列了前三條，`Handle::spawn`、`JoinSet::spawn`、`spawn_blocking`、OS 執行緒都繞得過。
disallowed-methods = [
    { path = "tokio::spawn", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio::task::spawn", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio::task::spawn_blocking", reason = "背景 task 走 BackgroundGate::spawn；當場 await 的阻塞工作就地 allow 寫明（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio::runtime::Handle::spawn", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio::task::JoinSet::spawn", reason = "背景 task 走 BackgroundGate::spawn；父 task 自己收的子 task 就地 allow 寫明（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "tokio_util::task::TaskTracker::spawn", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "wbf_sdk::task_stop::StoppableTask::spawn", reason = "背景 task 走 BackgroundGate::spawn（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "std::thread::spawn", reason = "背景工作走 BackgroundGate::spawn；真的要 OS 執行緒的就地 allow 寫明誰收它（/docs/design/daemon/task-supervision.md §2.4）" },
    { path = "std::thread::Builder::spawn", reason = "背景工作走 BackgroundGate::spawn；真的要 OS 執行緒的就地 allow 寫明誰收它（/docs/design/daemon/task-supervision.md §2.4）" },
]
