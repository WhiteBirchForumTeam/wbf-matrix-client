[package]
name = "wbf-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wbfuwunel 的 client SDK。第 2 步第 1 個 PR：每塊 AEAD、描述加密、事件區塊（約定規格書 §2–§4、§7）。"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cpufeatures = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
