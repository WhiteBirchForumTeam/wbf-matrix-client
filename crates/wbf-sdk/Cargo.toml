[package]
name = "wbf-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wbfuwunel 的 client SDK：每塊 AEAD、事件區塊、WebSocket／HTTP 通道、登入、分塊上傳／下載／seek／續傳。"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cpufeatures = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
wbf-wire = { path = "../wbf-wire" }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
http = "1"

[dev-dependencies]
