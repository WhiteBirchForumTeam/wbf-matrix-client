[package]
name = "wbf-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wbfuwunel 的 client SDK：每塊 AEAD、事件區塊、WebSocket／HTTP 通道、登入、分塊上傳／下載／seek／續傳。"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cpufeatures = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
wbf-wire = { path = "../wbf-wire" }
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
# 目錄名的 Base58（local-cache-db.md §11.2）：字母表沒有 0OIl 也沒有底線，所以 `_` 能當分隔符。
bs58 = "0.5"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
http = "1"
matrix-sdk = { path = "../../vendor/matrix-rust-sdk/crates/matrix-sdk", default-features = false, features = ["e2e-encryption", "bundled-sqlite"], optional = true }
# E2EE 的狀態機（`OlmMachine`）：只當加解密的引用，網路自己走 WS（e2ee-walkthrough.md §13）。跟 matrix-sdk 同一棵 vendor 樹，版本一定一致。
matrix-sdk-crypto = { path = "../../vendor/matrix-rust-sdk/crates/matrix-sdk-crypto", optional = true }
futures-core = { version = "0.3", optional = true }
# cache.db（local-cache-db.md §3）：SQLCipher，raw key 由 vault 導出。Windows 編 OpenSSL 要 Strawberry Perl（§3 的建置需求）。
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "limits", "cache"], optional = true }

[features]
default = []
# 第 3 步的房間 backend：唯一 use matrix_sdk 的地方是 src/backend/matrix_sdk.rs（plan-v1 §7.2）。
# 預設關：wbf-sdk 本體不拖 matrix-sdk，apps/wbf-cli 才開。
matrix = ["dep:matrix-sdk", "dep:matrix-sdk-crypto", "dep:futures-core"]
# 本地快取 cache.db（local-cache-db.md §6）。與 matrix feature 的 store 共用同一份 libsqlite3-sys（feature 統一後是 SQLCipher 版）。
cache = ["dep:rusqlite"]

[dev-dependencies]
