[package]
name = "wbf-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "client 本體：core ＋ RPC 服務（加密的 JSON over loopback WS）。介面見 /docs/design/rpc-specs/rpc-spec.md、分層見 /docs/design/overview/architecture-v2.md。"

[[bin]]
name = "wbf-matrix-client-daemon"
path = "src/main.rs"

[dependencies]
wbf-core = { path = "../wbf-core" }
wbf-sdk = { path = "../wbf-sdk", features = ["matrix", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
blake3 = "1"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# 資料平面 URL 裡的 access key（/docs/design/rpc-specs/data-plane.md §2）；跟 wbf-sdk 目錄名的 Base58 同一份。
bs58 = "0.5"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# 資料平面的 HTTP（/docs/design/rpc-specs/data-plane.md）：hyper 本來就在依賴樹裡（reqwest），這裡只多開 server 那半。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
# 真 server 的 e2e 用：像別的 client（Element…）那樣上傳標準附件、送事件（tests/real_server.rs）。兩個都跟 wbf-sdk 同一份。
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
matrix-sdk-crypto = { path = "../../vendor/matrix-rust-sdk/crates/matrix-sdk-crypto" }
